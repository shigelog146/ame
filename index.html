<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>益田地域 河川水位・雨量情報</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>

<body>

  <!-- =========================================================
       ヘッダー
       ========================================================= -->
  <header class="topbar">
    <div class="brand">
      <i data-lucide="waves"></i>
      益田地域 河川水位・雨量情報
    </div>
    <div class="spacer"></div>
    <button id="refreshBtn" class="icon-btn" title="更新">
      <i data-lucide="refresh-cw"></i>
    </button>
  </header>

  <main class="page">

    <!-- =========================================================
         免責事項（仕様書2章: 必須表示）
         ========================================================= -->
    <div class="disclaimer">
      <i data-lucide="alert-triangle"></i>
      本システムの予測値は、過去の雨量・水位データ等から独自に算出した参考値です。災害時には自治体・気象庁・島根県等が発表する最新の防災情報を優先してください。
    </div>

    <div id="updateInfo" class="update-info">読み込み中...</div>

    <!-- =========================================================
         水位セクション
         ========================================================= -->
    <section class="section">
      <h2><i data-lucide="waves"></i> 水位</h2>
      <div id="waterList" class="station-list">
        <div class="loading">読み込み中...</div>
      </div>
    </section>

    <!-- =========================================================
         雨量セクション
         ========================================================= -->
    <section class="section">
      <h2><i data-lucide="cloud-rain"></i> 雨量</h2>
      <div id="rainList" class="station-list">
        <div class="loading">読み込み中...</div>
      </div>
    </section>

  </main>

  <!-- =========================================================
       グラフダイアログ（観測所カードをタップすると開く）
       ========================================================= -->
  <dialog id="chartDialog">
    <div class="dialog-head">
      <h2 id="chartDialogTitle">観測所名</h2>
      <button class="dialog-close" data-close-dialog="chartDialog">✕</button>
    </div>
    <div class="dialog-body">
      <div class="chart-range-tabs">
        <button class="range-btn active" data-hours="24">24時間</button>
        <button class="range-btn" data-hours="72">3日間</button>
        <button class="range-btn" data-hours="168">7日間</button>
        <button class="range-btn" data-hours="720">30日間</button>
        <button class="range-btn" data-hours="4320">半年</button>
        <button class="range-btn" data-hours="8760">1年</button>
      </div>
      <div class="chart-wrap">
        <canvas id="historyChart"></canvas>
      </div>
      <div id="predictionSummary" class="prediction-summary"></div>
      <div id="chartLoading" class="loading" style="display:none;">読み込み中...</div>
    </div>
  </dialog>

  <!-- =========================================================
       JavaScript
       ========================================================= -->
  <script type="module">

    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://csaatvnbaspkzrqomnvt.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNzYWF0dm5iYXNwa3pycW9tbnZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMTE3MjYsImV4cCI6MjEwNTc4NzcyNn0.DjiKrsL5NG2KBza3wiqw87Cq1U9QAeMbMtywTdhX1Rc"
    );

    const AREA = "益田";

    // 過去何分ぶんの観測データを取得するか（この範囲の中から各観測所の最新1件を拾う）
    const LOOKBACK_MINUTES = 180;

    // predict-water-level Edge Function と揃える必要がある値
    const MODEL_VERSION = "v1-linear-extrapolation";
    const SCENARIO = "trend_continues";

    const updateInfo = document.getElementById("updateInfo");
    const waterList = document.getElementById("waterList");
    const rainList = document.getElementById("rainList");
    const refreshBtn = document.getElementById("refreshBtn");

    /* =========================================================
       観測値の異常値コード（"欠測"/"保守"/"未収集" 等）を
       人が読める文言に変換する
       ========================================================= */
    function statusLabel(dataStatus, rawDt) {
      if (dataStatus === 0) return null; // 正常時は何も表示しない
      if (rawDt && typeof rawDt === "string" && rawDt.trim() !== "") return rawDt; // "欠測"などの原文
      return "異常値";
    }

    /* =========================================================
       水位の危険度を基準水位と比較して判定する
       waiting(待機) < caution(氾濫注意) < evacuation(避難判断)
         < danger(氾濫危険) < overflow(氾濫発生) の想定
       ========================================================= */
    function waterLevelSeverity(level, station) {
      if (level === null || level === undefined) return { rank: -1, label: "データなし", cls: "muted" };

      const thresholds = [
        { key: "overflow_level", rank: 5, label: "氾濫発生水位超過", cls: "danger" },
        { key: "danger_level", rank: 4, label: "氾濫危険水位超過", cls: "danger" },
        { key: "evacuation_level", rank: 3, label: "避難判断水位超過", cls: "warn" },
        { key: "caution_level", rank: 2, label: "氾濫注意水位超過", cls: "caution" },
        { key: "waiting_level", rank: 1, label: "待機水位超過", cls: "notice" },
      ];

      for (const t of thresholds) {
        const th = station[t.key];
        if (th !== null && th !== undefined && level >= th) {
          return { rank: t.rank, label: t.label, cls: t.cls };
        }
      }
      return { rank: 0, label: "平常", cls: "normal" };
    }

    /* =========================================================
       データ取得
       ========================================================= */
    async function fetchStations() {
      const { data, error } = await supabase
        .from("river_stations")
        .select("*")
        .eq("area", AREA)
        .eq("is_active", true);
      if (error) throw error;
      return data ?? [];
    }

    async function fetchLatestWaterLevels() {
      const since = new Date(Date.now() - LOOKBACK_MINUTES * 60 * 1000).toISOString();
      const { data, error } = await supabase
        .from("water_level_observations")
        .select("station_id, observed_at, water_level, water_level_change, data_status, raw_data")
        .gte("observed_at", since)
        .order("observed_at", { ascending: false });
      if (error) throw error;

      // 観測所ごとに最新1件だけを残す（降順取得なので最初に出てきたものが最新）
      const latest = new Map();
      for (const row of data ?? []) {
        if (!latest.has(row.station_id)) latest.set(row.station_id, row);
      }
      return latest;
    }

    async function fetchLatestRainfall() {
      const since = new Date(Date.now() - LOOKBACK_MINUTES * 60 * 1000).toISOString();
      const { data, error } = await supabase
        .from("rainfall_observations")
        .select("station_id, observed_at, rain_10min, rain_cumulative, rainfall_start_at, data_status, raw_data")
        .gte("observed_at", since)
        .order("observed_at", { ascending: false });
      if (error) throw error;

      const latest = new Map();
      for (const row of data ?? []) {
        if (!latest.has(row.station_id)) latest.set(row.station_id, row);
      }
      return latest;
    }

    // 一覧カード用: 各観測所の「1時間後(参考)」予測値だけをまとめて取得
    async function fetchLatestOneHourPredictions() {
      const { data, error } = await supabase
        .from("predictions")
        .select("station_id, base_observed_at, predicted_level")
        .eq("prediction_minutes", 60)
        .eq("model_version", MODEL_VERSION)
        .eq("scenario", SCENARIO)
        .order("base_observed_at", { ascending: false })
        .limit(200);
      if (error) throw error;

      const latest = new Map();
      for (const row of data ?? []) {
        if (!latest.has(row.station_id)) latest.set(row.station_id, row);
      }
      return latest;
    }

    // Supabaseは1回の取得が最大1000件までのため、1000件ずつ繰り返して全件取得する
    // （7日分の10分データは約1008件あり、従来は末尾数件が欠けていた）
    async function fetchAllRows(buildQuery) {
      const PAGE = 1000;
      let all = [];
      for (let from = 0; ; from += PAGE) {
        const { data, error } = await buildQuery().range(from, from + PAGE - 1);
        if (error) throw error;
        all = all.concat(data ?? []);
        if (!data || data.length < PAGE) break;
      }
      return all;
    }

    async function fetchWaterHistory(stationId, hours) {
      const since = new Date(Date.now() - hours * 60 * 60 * 1000).toISOString();
      return fetchAllRows(() => supabase
        .from("water_level_observations")
        .select("observed_at, water_level")
        .eq("station_id", stationId)
        .gte("observed_at", since)
        .order("observed_at", { ascending: true }));
    }

    async function fetchRainHistory(stationId, hours) {
      const since = new Date(Date.now() - hours * 60 * 60 * 1000).toISOString();
      return fetchAllRows(() => supabase
        .from("rainfall_observations")
        .select("observed_at, rain_10min, rain_cumulative")
        .eq("station_id", stationId)
        .gte("observed_at", since)
        .order("observed_at", { ascending: true }));
    }

    // ---- 長期間（7日超）用: DB側で集計したデータを取得する ----
    // 7日(168時間)を超える期間は10分データをそのまま描画せず、
    // 集計済みデータ（水位=平均/最高/最低、雨量=合計）を使う
    const LONG_RANGE_HOURS = 168;

    function bucketMinutesFor(hours) {
      if (hours <= 720) return 60;    // 30日以内 → 1時間ごと（最大720点）
      if (hours <= 4320) return 360;  // 半年以内 → 6時間ごと（最大720点）
      return 1440;                    // 1年 → 1日ごと（最大365点）
    }

    async function fetchWaterSeries(stationId, hours) {
      const since = new Date(Date.now() - hours * 60 * 60 * 1000).toISOString();
      const { data, error } = await supabase.rpc("get_water_level_series", {
        p_station_id: stationId,
        p_since: since,
        p_bucket_minutes: bucketMinutesFor(hours),
      });
      if (error) throw error;
      return data ?? [];
    }

    async function fetchRainSeries(stationId, hours) {
      const since = new Date(Date.now() - hours * 60 * 60 * 1000).toISOString();
      const { data, error } = await supabase.rpc("get_rainfall_series", {
        p_station_id: stationId,
        p_since: since,
        p_bucket_minutes: bucketMinutesFor(hours),
      });
      if (error) throw error;
      return data ?? [];
    }

    // 観測所詳細のグラフダイアログ用: 最新base_observed_at分の予測(30/60/120/180/360分後)を取得
    async function fetchLatestPredictionsForStation(stationId) {
      const { data, error } = await supabase
        .from("predictions")
        .select("base_observed_at, prediction_minutes, predicted_level")
        .eq("station_id", stationId)
        .eq("model_version", MODEL_VERSION)
        .eq("scenario", SCENARIO)
        .order("base_observed_at", { ascending: false })
        .order("prediction_minutes", { ascending: true })
        .limit(20); // 直近の複数base分をまとめて取得し、最新base分だけをJS側で抽出
      if (error) throw error;
      const rows = data ?? [];
      if (rows.length === 0) return [];
      const latestBase = rows[0].base_observed_at;
      return rows.filter((r) => r.base_observed_at === latestBase);
    }

    /* =========================================================
       描画
       ========================================================= */
    function formatTime(iso) {
      if (!iso) return "--:--";
      const d = new Date(iso);
      return d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    }

    function renderWaterStations(stations, latestMap, predictionMap) {
      const waterStations = stations
        .filter((s) => s.station_type === "water" || s.station_type === "both")
        .sort((a, b) => (a.river_name ?? "").localeCompare(b.river_name ?? "", "ja"));

      if (waterStations.length === 0) {
        waterList.innerHTML = '<div class="loading">対象観測所がありません</div>';
        return;
      }

      waterList.innerHTML = waterStations.map((station) => {
        const obs = latestMap.get(station.id);
        const level = obs?.water_level ?? null;
        const severity = waterLevelSeverity(level, station);
        const anomaly = obs ? statusLabel(obs.data_status, obs.raw_data?.dt) : null;

        const levelText = level !== null
          ? `${level.toFixed(2)} m`
          : (anomaly ?? "データなし");

        const changeIcon = obs?.water_level_change > 0
          ? '<i data-lucide="trending-up"></i>'
          : obs?.water_level_change < 0
            ? '<i data-lucide="trending-down"></i>'
            : "";

        const pred = predictionMap.get(station.id);
        const predText = pred
          ? `<span class="prediction-note">1時間後(参考) ${pred.predicted_level.toFixed(2)} m</span>`
          : "";

        return `
          <div class="station-card clickable ${severity.cls}" data-station-id="${station.id}" data-obs-type="water">
            <div class="station-card-main">
              <div class="station-name">
                <span class="river-name">${station.river_name ?? ""}</span>
                ${station.station_name}
              </div>
              <div class="station-value">
                ${levelText} ${changeIcon}
              </div>
            </div>
            <div class="station-sub">
              <span class="severity-badge ${severity.cls}">${severity.label}</span>
              <span class="observed-time">${formatTime(obs?.observed_at)}時点</span>
            </div>
            ${predText ? `<div class="station-sub">${predText}</div>` : ""}
          </div>
        `;
      }).join("");

      if (window.lucide) lucide.createIcons();
    }

    function renderRainStations(stations, latestMap) {
      const rainStations = stations
        .filter((s) => s.station_type === "rainfall" || s.station_type === "both")
        .sort((a, b) => (a.river_name ?? "").localeCompare(b.river_name ?? "", "ja"));

      if (rainStations.length === 0) {
        rainList.innerHTML = '<div class="loading">対象観測所がありません</div>';
        return;
      }

      rainList.innerHTML = rainStations.map((station) => {
        const obs = latestMap.get(station.id);
        const anomaly = obs ? statusLabel(obs.data_status, obs.raw_data?.["1_10"]?.dt) : null;

        const tenMin = obs?.rain_10min ?? null;
        const cumulative = obs?.rain_cumulative ?? null;
        const isRaining = tenMin !== null && tenMin > 0;

        const tenMinText = tenMin !== null ? `${tenMin.toFixed(1)} mm` : (anomaly ?? "データなし");
        const cumulativeText = cumulative !== null ? `${cumulative.toFixed(1)} mm` : "-";
        const startText = obs?.rainfall_start_at
          ? `${formatTime(obs.rainfall_start_at)}〜降雨中`
          : "";

        return `
          <div class="station-card clickable ${isRaining ? "rain-active" : "normal"}" data-station-id="${station.id}" data-obs-type="rain">
            <div class="station-card-main">
              <div class="station-name">
                <span class="river-name">${station.river_name ?? ""}</span>
                ${station.station_name}
              </div>
              <div class="station-value">
                ${tenMinText}<span class="value-unit-note">/10分</span>
              </div>
            </div>
            <div class="station-sub">
              <span class="cumulative-note">累計 ${cumulativeText}</span>
              <span class="observed-time">${startText || (formatTime(obs?.observed_at) + "時点")}</span>
            </div>
          </div>
        `;
      }).join("");

      if (window.lucide) lucide.createIcons();
    }

    /* =========================================================
       グラフ（観測所カードをタップした時に表示）
       ========================================================= */
    let stationsById = new Map();
    let currentChart = null;
    let currentDialogStation = null; // { stationId, obsType }

    const chartDialog = document.getElementById("chartDialog");
    const chartDialogTitle = document.getElementById("chartDialogTitle");
    const chartLoading = document.getElementById("chartLoading");
    const historyCanvas = document.getElementById("historyChart");
    const predictionSummary = document.getElementById("predictionSummary");
    const rangeButtons = document.querySelectorAll(".range-btn");

    const THRESHOLD_DEFS = [
      { key: "waiting_level", label: "待機水位", color: "#b58a1a" },
      { key: "caution_level", label: "氾濫注意水位", color: "#d17a1f" },
      { key: "evacuation_level", label: "避難判断水位", color: "#c9501f" },
      { key: "danger_level", label: "氾濫危険水位", color: "#b8332b" },
      { key: "overflow_level", label: "氾濫発生水位", color: "#7a1f1a" },
    ];

    function destroyChart() {
      if (currentChart) {
        currentChart.destroy();
        currentChart = null;
      }
    }

    function chartLabel(iso) {
      const d = new Date(iso);
      return d.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    // 長期間グラフ用のラベル（30日以内は「月/日 時」、それより長い期間は「月/日」）
    function longChartLabel(iso, hours) {
      const d = new Date(iso);
      return hours <= 720
        ? d.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit" })
        : d.toLocaleString("ja-JP", { month: "numeric", day: "numeric" });
    }

    // 水位グラフのY軸上限を「実測・予測データの最大値」から計算する。
    // 危険水位等の基準線は考慮しない（基準線が実データよりずっと高い場合、
    // グラフが基準線に合わせて間延びし実データの変化が見えなくなるため）。
    function computeWaterAxisMax(levels, predictions) {
      const values = [
        ...levels.filter((v) => v !== null && v !== undefined),
        ...predictions.map((p) => p.predicted_level).filter((v) => v !== null && v !== undefined),
      ];
      if (values.length === 0) return undefined; // データが無ければChart.jsの自動計算に任せる
      const dataMax = Math.max(...values);
      const padding = Math.max(dataMax * 0.3, 0.3); // 最大値の30%、最低0.3mの余白
      return dataMax + padding;
    }

    // 長期間（30日・半年・1年）の水位グラフ: 平均・最高・最低を表示
    async function renderWaterChartLong(station, hours) {
      predictionSummary.innerHTML = ""; // 長期間では予測は表示しない
      const rows = await fetchWaterSeries(station.id, hours);
      const labels = rows.map((r) => longChartLabel(r.bucket_at, hours));
      const maxValues = rows.map((r) => (r.max_level === null ? null : Number(r.max_level)));

      const datasets = [
        {
          label: "最高水位 (m)",
          data: maxValues,
          borderColor: "#c9501f",
          backgroundColor: "rgba(28,110,164,0.12)",
          fill: 2, // 最高〜最低の間を薄く塗る（datasets[2]=最低水位まで）
          spanGaps: true,
          tension: 0.2,
          pointRadius: 0,
          borderWidth: 1,
        },
        {
          label: "平均水位 (m)",
          data: rows.map((r) => (r.avg_level === null ? null : Number(r.avg_level))),
          borderColor: "#1c6ea4",
          fill: false,
          spanGaps: true,
          tension: 0.2,
          pointRadius: 0,
        },
        {
          label: "最低水位 (m)",
          data: rows.map((r) => (r.min_level === null ? null : Number(r.min_level))),
          borderColor: "#7aa7c7",
          fill: false,
          spanGaps: true,
          tension: 0.2,
          pointRadius: 0,
          borderWidth: 1,
        },
      ];

      for (const t of THRESHOLD_DEFS) {
        const value = station[t.key];
        if (value === null || value === undefined) continue;
        datasets.push({
          label: t.label,
          data: labels.map(() => value),
          borderColor: t.color,
          borderDash: [2, 3],
          pointRadius: 0,
          borderWidth: 1,
        });
      }

      destroyChart();
      currentChart = new Chart(historyCanvas, {
        type: "line",
        data: { labels, datasets },
        options: {
          responsive: true,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } },
          scales: {
            x: { ticks: { maxTicksLimit: 8, maxRotation: 0 } },
            y: {
              title: { display: true, text: "水位 (m)" },
              suggestedMin: 0,
              max: computeWaterAxisMax(maxValues, []),
            },
          },
        },
      });
    }

    async function renderWaterChart(station, hours) {
      if (hours > LONG_RANGE_HOURS) {
        return renderWaterChartLong(station, hours);
      }
      const rows = await fetchWaterHistory(station.id, hours);
      const historyLabels = rows.map((r) => chartLabel(r.observed_at));
      const levels = rows.map((r) => r.water_level);

      // 予測（参考値）。仕様書36章: 実測=実線、予測=点線で同じグラフに重ねる
      let predictions = [];
      try {
        predictions = await fetchLatestPredictionsForStation(station.id);
      } catch (e) {
        console.error("予測の取得に失敗:", e);
      }

      const lastHistoryLevel = levels.length > 0 ? levels[levels.length - 1] : null;
      const showForecast = predictions.length > 0 && lastHistoryLevel !== null;

      const forecastLabels = showForecast
        ? predictions.map((p) => {
            const t = new Date(new Date(p.base_observed_at).getTime() + p.prediction_minutes * 60000);
            return chartLabel(t.toISOString());
          })
        : [];

      const combinedLabels = [...historyLabels, ...forecastLabels];

      const historyDataset = {
        label: "水位 (m)・実測",
        data: [...levels, ...forecastLabels.map(() => null)],
        borderColor: "#1c6ea4",
        backgroundColor: "rgba(28,110,164,0.12)",
        fill: true,
        spanGaps: true,
        tension: 0.2,
        pointRadius: 0,
      };

      const datasets = [historyDataset];

      if (showForecast) {
        // 実測の最後の点から予測点へ視覚的につながるよう、
        // 実測部分はnullで埋め、最後の実測値だけ接続点として入れる
        const forecastData = [
          ...historyLabels.slice(0, -1).map(() => null),
          lastHistoryLevel,
          ...predictions.map((p) => p.predicted_level),
        ];
        datasets.push({
          label: "水位 (m)・予測(参考)",
          data: forecastData,
          borderColor: "#1c6ea4",
          borderDash: [6, 4],
          fill: false,
          spanGaps: true,
          tension: 0.2,
          pointRadius: 2,
        });
      }

      for (const t of THRESHOLD_DEFS) {
        const value = station[t.key];
        if (value === null || value === undefined) continue;
        datasets.push({
          label: t.label,
          data: combinedLabels.map(() => value),
          borderColor: t.color,
          borderDash: [2, 3],
          pointRadius: 0,
          borderWidth: 1,
        });
      }

      destroyChart();
      currentChart = new Chart(historyCanvas, {
        type: "line",
        data: { labels: combinedLabels, datasets },
        options: {
          responsive: true,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } },
          scales: {
            y: {
              title: { display: true, text: "水位 (m)" },
              suggestedMin: 0,
              max: computeWaterAxisMax(levels, predictions),
            },
          },
        },
      });

      renderPredictionSummary(predictions);
    }

    function predictionMinutesLabel(minutes) {
      if (minutes < 60) return `${minutes}分後`;
      return `${minutes / 60}時間後`;
    }

    function renderPredictionSummary(predictions) {
      if (!predictions || predictions.length === 0) {
        predictionSummary.innerHTML = "";
        return;
      }
      predictionSummary.innerHTML = `
        <div class="prediction-summary-title">水位予測シミュレーション（参考）</div>
        <div class="prediction-summary-row">
          ${predictions.map((p) => `
            <div class="prediction-summary-item">
              <div class="prediction-summary-label">${predictionMinutesLabel(p.prediction_minutes)}</div>
              <div class="prediction-summary-value">${p.predicted_level.toFixed(2)} m</div>
            </div>
          `).join("")}
        </div>
        <div class="prediction-summary-note">
          現在の水位変化傾向がそのまま続いた場合の単純外挿による参考値です。断定的な予測ではありません。
        </div>
      `;
    }

    // 長期間（30日・半年・1年）の雨量グラフ: 期間ごとの合計雨量 + 期間内の累計
    async function renderRainChartLong(station, hours) {
      const rows = await fetchRainSeries(station.id, hours);
      const labels = rows.map((r) => longChartLabel(r.bucket_at, hours));

      let running = 0;
      const runningTotals = rows.map((r) => {
        running += Number(r.total_rain ?? 0);
        return Math.round(running * 10) / 10;
      });

      const bucketLabel = bucketMinutesFor(hours) === 60 ? "1時間" : (bucketMinutesFor(hours) === 360 ? "6時間" : "1日");

      destroyChart();
      currentChart = new Chart(historyCanvas, {
        data: {
          labels,
          datasets: [
            {
              type: "bar",
              label: `${bucketLabel}ごとの雨量 (mm)`,
              data: rows.map((r) => (r.total_rain === null ? null : Number(r.total_rain))),
              backgroundColor: "#2464b4",
              yAxisID: "y",
            },
            {
              type: "line",
              label: "期間内の累計 (mm)",
              data: runningTotals,
              borderColor: "#b58a1a",
              pointRadius: 0,
              spanGaps: true,
              yAxisID: "y1",
            },
          ],
        },
        options: {
          responsive: true,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } },
          scales: {
            x: { ticks: { maxTicksLimit: 8, maxRotation: 0 } },
            y: { position: "left", title: { display: true, text: `${bucketLabel}雨量 (mm)` }, beginAtZero: true },
            y1: { position: "right", title: { display: true, text: "累計 (mm)" }, beginAtZero: true, grid: { drawOnChartArea: false } },
          },
        },
      });
    }

    async function renderRainChart(station, hours) {
      predictionSummary.innerHTML = "";
      if (hours > LONG_RANGE_HOURS) {
        return renderRainChartLong(station, hours);
      }
      const rows = await fetchRainHistory(station.id, hours);
      const labels = rows.map((r) => chartLabel(r.observed_at));

      destroyChart();
      currentChart = new Chart(historyCanvas, {
        data: {
          labels,
          datasets: [
            {
              type: "bar",
              label: "10分雨量 (mm)",
              data: rows.map((r) => r.rain_10min),
              backgroundColor: "#2464b4",
              yAxisID: "y",
            },
            {
              type: "line",
              label: "累計雨量 (mm)",
              data: rows.map((r) => r.rain_cumulative),
              borderColor: "#b58a1a",
              pointRadius: 0,
              spanGaps: true,
              yAxisID: "y1",
            },
          ],
        },
        options: {
          responsive: true,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } },
          scales: {
            y: { position: "left", title: { display: true, text: "10分雨量 (mm)" }, beginAtZero: true },
            y1: { position: "right", title: { display: true, text: "累計 (mm)" }, beginAtZero: true, grid: { drawOnChartArea: false } },
          },
        },
      });
    }

    async function openChartDialog(stationId, obsType, hours = 24) {
      const station = stationsById.get(Number(stationId));
      if (!station) return;

      currentDialogStation = { stationId: Number(stationId), obsType };
      chartDialogTitle.textContent = `${station.river_name ?? ""} ${station.station_name}`;
      chartLoading.style.display = "block";
      historyCanvas.style.display = "none";
      chartDialog.showModal();

      try {
        if (obsType === "water") {
          await renderWaterChart(station, hours);
        } else {
          await renderRainChart(station, hours);
        }
        chartLoading.style.display = "none";
        historyCanvas.style.display = "block";
      } catch (e) {
        console.error(e);
        chartLoading.textContent = "グラフの取得に失敗しました";
      }
    }

    document.querySelectorAll("[data-close-dialog]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.getElementById(btn.dataset.closeDialog).close();
      });
    });

    chartDialog.addEventListener("close", () => {
      destroyChart();
      chartLoading.textContent = "読み込み中...";
      predictionSummary.innerHTML = "";
      rangeButtons.forEach((b) => b.classList.toggle("active", b.dataset.hours === "24"));
    });

    rangeButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        if (!currentDialogStation) return;
        rangeButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        chartLoading.style.display = "block";
        historyCanvas.style.display = "none";
        openChartDialog(currentDialogStation.stationId, currentDialogStation.obsType, Number(btn.dataset.hours));
      });
    });

    function wireCardClicks(container) {
      container.addEventListener("click", (e) => {
        const card = e.target.closest(".station-card[data-station-id]");
        if (!card) return;
        openChartDialog(card.dataset.stationId, card.dataset.obsType, 24);
      });
    }
    wireCardClicks(waterList);
    wireCardClicks(rainList);

    /* =========================================================
       メイン処理
       ========================================================= */
    async function loadAll() {
      updateInfo.textContent = "読み込み中...";
      try {
        const [stations, waterLatest, rainLatest, predictionLatest] = await Promise.all([
          fetchStations(),
          fetchLatestWaterLevels(),
          fetchLatestRainfall(),
          fetchLatestOneHourPredictions(),
        ]);

        stationsById = new Map(stations.map((s) => [s.id, s]));

        renderWaterStations(stations, waterLatest, predictionLatest);
        renderRainStations(stations, rainLatest);

        updateInfo.textContent = `最終更新: ${new Date().toLocaleTimeString("ja-JP")}`;
      } catch (e) {
        console.error(e);
        updateInfo.textContent = "データの取得に失敗しました";
      }
    }

    refreshBtn.addEventListener("click", loadAll);

    loadAll();
    // 5分ごとに自動更新
    setInterval(loadAll, 5 * 60 * 1000);

  </script>

</body>

</html>
